[workspace]
resolver = "3"
members = ["crates/sony-core", "crates/sony-usb", "crates/sony-install", "crates/app", "crates/sony-gui"]

[workspace.package]
version = "1.0.3"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 手写 TLS 1.0 所需的密码学原语（全部是 pure Rust，不需要 C 工具链）
rsa = "0.9"
sha1 = "0.10"
md-5 = "0.10"
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
cbc = "0.1"
pem = "3.0"
num-bigint-dig = "0.8"

# Windows 便携设备（WPD）COM 接口。只取底层 FFI，自己写最小的 COM 绑定，
# 避免引入完整的 windows crate（编译更慢、产物更大）。
[workspace.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    # 用 SetupAPI 枚举所有索尼 USB 设备 —— 这样即使相机设成了
    # 「海量存储器」（不是 WPD 设备），也能认出"相机其实插着，只是模式不对"
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    # 海量存储器通道：对磁盘卷发 SCSI 直通命令，把较老的机型
    # （α6000 等）切到应用安装模式。见 sony-usb/src/msc.rs
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    # CreateFileW 的签名里带 SECURITY_ATTRIBUTES，所以被 gate 在 Security 下
    "Win32_Security",
    # DRIVE_REMOVABLE 在这个模块里
    "Win32_System_WindowsProgramming",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
