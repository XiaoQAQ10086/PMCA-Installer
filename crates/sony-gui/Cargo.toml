[package]
name = "sony-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PMCA 安装器 —— 给索尼相机安装 Android 应用的图形工具"
# 把图标嵌进 exe（见 build.rs）
build = "build.rs"

[lib]
name = "sony_gui"
path = "src/lib.rs"

[[bin]]
# 发布用的可执行文件名（GitHub 上就叫这个）
name = "PMCA-Installer"
path = "src/main.rs"

[dependencies]
sony-core = { path = "../sony-core" }
sony-usb = { path = "../sony-usb" }
sony-install = { path = "../sony-install" }
anyhow.workspace = true
tracing.workspace = true
serde_json.workspace = true

# 只启用 Windows 上真正需要的部分：
# - tiny-skia：纯 CPU 渲染，不需要显卡依赖，体积小、启动快
# - smol：最轻的异步执行器（iced 必须要一个，用来跑 Task）
# - 关掉默认特性，避免把 wgpu（几十 MB）和 x11/wayland 一起拉进来
iced = { version = "0.14", default-features = false, features = [
    "tiny-skia",
    "crisp",
    "web-colors",
    "smol",
] }

# 原生「打开文件」对话框
rfd = "0.15"

# 检查更新用系统自带的 WinHTTP（见 src/update.rs），
# 另外用 ShellExecuteW 打开浏览器
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
